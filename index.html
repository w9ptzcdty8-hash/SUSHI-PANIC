<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寿司パニック</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 854px;
            background: #222;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #332;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Virtual resolution
        const VIRTUAL_WIDTH = 480;
        const VIRTUAL_HEIGHT = 854;

        function resizeCanvas() {
            canvas.width = VIRTUAL_WIDTH;
            canvas.height = VIRTUAL_HEIGHT;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game state (TITLE, PLAY, PAUSE, GAMEOVER)
        let gameState = 'TITLE';
        let selectedDifficulty = 'EASY';
        let score = 0;
        let customers = [];
        let maxCustomers = 1;
        let gameTime = 0;
        let servedCount = 0;
        let toastMessage = "";
        let toastTimer = 0;

        // Cooking station state
        let stagedRice = false;
        let stagedNori = false;
        let stagedTopping = null;
        let isCut = false;
        let hasWasabi = false;

        // Toppings definition
        const TOPPINGS = {
            maguro: { name: 'マグロ', color: '#e74c3c', type: 'nigiri', price: 500 },
            salmon: { name: 'サーモン', color: '#e67e22', type: 'nigiri', price: 600 },
            tamago: { name: 'たまご', color: '#f1c40f', type: 'nigiri', price: 300 },
            ebi: { name: 'エビ', color: '#ff7675', type: 'nigiri', price: 450 },
            ikura: { name: 'イクラ', color: '#fab1a0', type: 'gunkan', price: 800 }
        };

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'tap') {
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function showToast(msg) {
            toastMessage = msg;
            toastTimer = 2.0;
        }

        // Generate Debug Data JSON
        function copyDebugLogToClipboard() {
            const debugData = {
                timestamp: new Date().toISOString(),
                gameState: gameState,
                selectedDifficulty: selectedDifficulty,
                score: score,
                servedCount: servedCount,
                gameTimeSeconds: Math.floor(gameTime),
                kitchenState: {
                    stagedRice: stagedRice,
                    stagedNori: stagedNori,
                    stagedTopping: stagedTopping,
                    isCut: isCut,
                    hasWasabi: hasWasabi
                },
                customers: customers,
                canvasSize: {
                    virtualWidth: VIRTUAL_WIDTH,
                    virtualHeight: VIRTUAL_HEIGHT,
                    actualWidth: canvas.getBoundingClientRect().width,
                    actualHeight: canvas.getBoundingClientRect().height
                },
                userAgent: navigator.userAgent
            };

            const logDataStr = JSON.stringify(debugData, null, 2);
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(logDataStr).then(() => {
                    showToast("デバッグログをコピーしました！");
                }).catch(() => {
                    fallbackCopy(logDataStr);
                });
            } else {
                fallbackCopy(logDataStr);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("デバッグログをコピーしました！");
            } catch (err) {
                showToast("コピーに失敗しました");
            }
            document.body.removeChild(textArea);
        }

        // Input Handling
        function handleTouch(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = VIRTUAL_WIDTH / rect.width;
            const scaleY = VIRTUAL_HEIGHT / rect.height;
            const vx = (x - rect.left) * scaleX;
            const vy = (y - rect.top) * scaleY;

            if (gameState === 'TITLE') {
                if (vy > 420 && vy < 500 && vx > 100 && vx < 380) {
                    selectedDifficulty = 'EASY';
                    maxCustomers = 1;
                    startGame();
                    playSound('tap');
                } else if (vy > 520 && vy < 600 && vx > 100 && vx < 380) {
                    playSound('error');
                }
            } else if (gameState === 'PAUSE') {
                // Resume
                if (vy > 330 && vy < 390 && vx > 100 && vx < 380) {
                    gameState = 'PLAY';
                    playSound('tap');
                }
                // Retry
                else if (vy > 410 && vy < 470 && vx > 100 && vx < 380) {
                    startGame();
                    playSound('tap');
                }
                // Title
                else if (vy > 490 && vy < 550 && vx > 100 && vx < 380) {
                    gameState = 'TITLE';
                    playSound('tap');
                }
                // Debug Log Copy
                else if (vy > 570 && vy < 630 && vx > 100 && vx < 380) {
                    copyDebugLogToClipboard();
                    playSound('tap');
                }
            } else if (gameState === 'GAMEOVER') {
                if (vy > 500 && vy < 600 && vx > 100 && vx < 380) {
                    gameState = 'TITLE';
                    playSound('tap');
                }
            } else if (gameState === 'PLAY') {
                // Pause button (Top-Right)
                if (vx > 370 && vx < 460 && vy > 10 && vy < 55) {
                    gameState = 'PAUSE';
                    playSound('tap');
                    return;
                }

                // Customer serve tap
                for (let i = 0; i < customers.length; i++) {
                    const c = customers[i];
                    if (vx > c.x - 60 && vx < c.x + 60 && vy > 80 && vy < 220) {
                        tryServe(i);
                        return;
                    }
                }

                // Reset plate button
                if (vx > 380 && vx < 460 && vy > 580 && vy < 650) {
                    resetPlate();
                    playSound('tap');
                    return;
                }

                // Topping Palette Selection (5 items correctly spaced: 10px margin, 80px width each)
                // x-coords: 15, 105, 195, 285, 375
                const keys = Object.keys(TOPPINGS);
                const itemWidth = 80;
                const itemGap = 10;
                const startX = 15;
                keys.forEach((key, index) => {
                    const nx = startX + index * (itemWidth + itemGap);
                    if (vx >= nx && vx <= nx + itemWidth && vy >= 600 && vy <= 680) {
                        stagedTopping = key;
                        isCut = false;
                        playSound('tap');
                    }
                });

                // Action Buttons (4 items correctly spaced: 20px margin, 95px width each)
                // 1. Rice
                if (vx >= 20 && vx <= 115 && vy >= 720 && vy <= 800) {
                    stagedRice = true;
                    playSound('tap');
                }
                // 2. Nori
                else if (vx >= 130 && vx <= 225 && vy >= 720 && vy <= 800) {
                    stagedNori = true;
                    playSound('tap');
                }
                // 3. Knife
                else if (vx >= 240 && vx <= 335 && vy >= 720 && vy <= 800) {
                    if (stagedTopping && !isCut) {
                        isCut = true;
                        playSound('tap');
                    }
                }
                // 4. Wasabi
                else if (vx >= 350 && vx <= 445 && vy >= 720 && vy <= 800) {
                    if (stagedRice && !hasWasabi) {
                        hasWasabi = true;
                        playSound('tap');
                    }
                }
            }
        }

        window.addEventListener('pointerdown', (e) => {
            handleTouch(e.clientX, e.clientY);
            e.preventDefault();
        }, { passive: false });

        function startGame() {
            gameState = 'PLAY';
            score = 0;
            servedCount = 0;
            customers = [];
            gameTime = 0;
            resetPlate();
            spawnCustomer();
        }

        function resetPlate() {
            stagedRice = false;
            stagedNori = false;
            stagedTopping = null;
            isCut = false;
            hasWasabi = false;
        }

        function spawnCustomer() {
            if (customers.length >= maxCustomers) return;
            const keys = Object.keys(TOPPINGS);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const topping = TOPPINGS[randomKey];

            customers.push({
                toppingKey: randomKey,
                toppingName: topping.name,
                type: topping.type,
                price: topping.price,
                patience: 100,
                maxPatience: 100,
                x: VIRTUAL_WIDTH / 2
            });
        }

        function tryServe(customerIndex) {
            const customer = customers[customerIndex];
            
            let valid = true;
            if (!stagedRice) valid = false;
            if (!stagedTopping || stagedTopping !== customer.toppingKey) valid = false;
            
            if (customer.type === 'gunkan') {
                if (!stagedNori) valid = false;
            } else {
                if (stagedNori) valid = false;
                if (!isCut) valid = false;
            }

            if (valid) {
                score += customer.price;
                servedCount++;
                customers.splice(customerIndex, 1);
                playSound('success');
                resetPlate();
                setTimeout(() => {
                    if (gameState === 'PLAY' && customers.length === 0) {
                        spawnCustomer();
                    }
                }, 400);
            } else {
                playSound('error');
                customer.patience -= 15;
            }
        }

        function update(dt) {
            if (toastTimer > 0) {
                toastTimer -= dt;
            }

            if (gameState !== 'PLAY') return;

            gameTime += dt;

            customers.forEach(c => {
                c.patience -= dt * 2.2;
                if (c.patience <= 0) {
                    gameState = 'GAMEOVER';
                    playSound('error');
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            if (gameState === 'TITLE') {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 44px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('寿司パニック', VIRTUAL_WIDTH / 2, 220);

                ctx.fillStyle = '#fff';
                ctx.font = '18px sans-serif';
                ctx.fillText('難易度を選んでください', VIRTUAL_WIDTH / 2, 340);

                // EASY Mode Button
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(100, 420, 280, 80);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 26px sans-serif';
                ctx.fillText('EASY モード (客1人)', VIRTUAL_WIDTH / 2, 468);

                // NORMAL Mode Button
                ctx.fillStyle = '#555';
                ctx.fillRect(100, 520, 280, 80);
                ctx.fillStyle = '#aaa';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('NORMAL (準備中)', VIRTUAL_WIDTH / 2, 568);
                return;
            }

            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 48px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ゲームオーバー', VIRTUAL_WIDTH / 2, 250);

                ctx.fillStyle = '#fff';
                ctx.font = '24px sans-serif';
                ctx.fillText(`売上総額: ￥${score}`, VIRTUAL_WIDTH / 2, 340);

                ctx.fillStyle = '#2980b9';
                ctx.fillRect(100, 500, 280, 80);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 26px sans-serif';
                ctx.fillText('タイトルへ戻る', VIRTUAL_WIDTH / 2, 552);
                return;
            }

            // --- Gameplay Screen ---
            // Counter Top Background
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, 240);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(0, 230, VIRTUAL_WIDTH, 20);

            // Score Display
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`売上: ￥${score}`, 20, 42);

            // Pause Button
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(370, 10, 90, 45);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⏸ ポーズ', 415, 38);

            // Customer rendering
            customers.forEach((c) => {
                ctx.fillStyle = '#ecf0f1';
                ctx.beginPath();
                ctx.arc(c.x, 140, 45, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#555';
                ctx.fillRect(c.x - 50, 75, 100, 12);
                
                const ratio = Math.max(0, c.patience / c.maxPatience);
                ctx.fillStyle = ratio > 0.4 ? '#2ecc71' : '#e74c3c';
                ctx.fillRect(c.x - 50, 75, 100 * ratio, 12);

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.roundRect(c.x - 70, 15, 140, 50, 8);
                ctx.fill();

                ctx.fillStyle = '#2c3e50';
                ctx.font = '15px sans-serif';
                ctx.textAlign = 'center';
                let orderText = c.toppingName;
                if (c.type === 'gunkan') orderText += '(軍艦)';
                else orderText += '(握り)';
                ctx.fillText(orderText, c.x, 45);
            });

            // Kitchen Board Area
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(20, 280, 440, 290);
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 280, 440, 290);

            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('【 まな板 / お皿 】', 35, 310);

            let previewY = 350;
            ctx.font = '18px sans-serif';
            ctx.fillText(`シャリ: ${stagedRice ? '✅ 準備OK' : '❌ 未'}`, 40, previewY);
            previewY += 40;
            ctx.fillText(`海苔(軍艦用): ${stagedNori ? '✅ 使用中' : '❌ なし'}`, 40, previewY);
            previewY += 40;
            let toppingDisplay = stagedTopping ? TOPPINGS[stagedTopping].name : 'なし';
            if (stagedTopping && TOPPINGS[stagedTopping].type === 'nigiri') {
                toppingDisplay += isCut ? ' (✅ 包丁カット済)' : ' (❌ 未カット)';
            }
            ctx.fillText(`ネタ: ${toppingDisplay}`, 40, previewY);

            // Reset Button (Trash)
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(380, 580, 80, 60);
            ctx.fillStyle = '#fff';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('やり直し', 420, 615);

            // Topping Palette Buttons (5 items: Width 80, Gap 10, Start 15)
            const keys = Object.keys(TOPPINGS);
            const itemWidth = 80;
            const itemGap = 10;
            const startX = 15;
            keys.forEach((key, index) => {
                const nx = startX + index * (itemWidth + itemGap);
                const isSelected = stagedTopping === key;
                ctx.fillStyle = isSelected ? '#2980b9' : '#7f8c8d';
                ctx.fillRect(nx, 600, itemWidth, 80);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(TOPPINGS[key].name, nx + itemWidth / 2, 645);
            });

            // Action Buttons (4 items: Width 95, Gap 10, Start 20)
            // 1. Rice
            ctx.fillStyle = stagedRice ? '#27ae60' : '#e67e22';
            ctx.fillRect(20, 720, 95, 80);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('シャリ', 67, 765);

            // 2. Nori
            ctx.fillStyle = stagedNori ? '#27ae60' : '#e67e22';
            ctx.fillRect(130, 720, 95, 80);
            ctx.fillStyle = '#fff';
            ctx.fillText('のり', 177, 765);

            // 3. Knife
            ctx.fillStyle = isCut ? '#27ae60' : '#e67e22';
            ctx.fillRect(240, 720, 95, 80);
            ctx.fillStyle = '#fff';
            ctx.fillText('包丁', 287, 765);

            // 4. Wasabi
            ctx.fillStyle = hasWasabi ? '#27ae60' : '#e67e22';
            ctx.fillRect(350, 720, 95, 80);
            ctx.fillStyle = '#fff';
            ctx.fillText('わさび', 397, 765);

            // --- Pause Screen Overlay ---
            if (gameState === 'PAUSE') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSE', VIRTUAL_WIDTH / 2, 180);

                ctx.fillStyle = '#fff';
                ctx.font = '22px sans-serif';
                ctx.fillText(`現在の売上: ￥${score}`, VIRTUAL_WIDTH / 2, 250);

                // Button 1: Resume
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(100, 330, 280, 60);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('ゲームを再開', VIRTUAL_WIDTH / 2, 368);

                // Button 2: Retry
                ctx.fillStyle = '#e67e22';
                ctx.fillRect(100, 410, 280, 60);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('やり直し (リトライ)', VIRTUAL_WIDTH / 2, 448);

                // Button 3: Return to Title
                ctx.fillStyle = '#2980b9';
                ctx.fillRect(100, 490, 280, 60);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('タイトルにもどる', VIRTUAL_WIDTH / 2, 528);

                // Button 4: Copy Debug Log
                ctx.fillStyle = '#8e44ad';
                ctx.fillRect(100, 570, 280, 60);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('📋 デバッグログコピー', VIRTUAL_WIDTH / 2, 608);
            }

            // Toast notification
            if (toastTimer > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(80, 700, 320, 50);
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 2;
                ctx.strokeRect(80, 700, 320, 50);

                ctx.fillStyle = '#fff';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(toastMessage, VIRTUAL_WIDTH / 2, 730);
            }
        }

        let lastTime = 0;
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
